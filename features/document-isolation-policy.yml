name: Document isolation policy
description: The `Document-Isolation-Policy` HTTP header makes a single document cross-origin isolated, giving it access to features such as `SharedArrayBuffer`, without requiring the pages that embed it or the content it embeds to send `Cross-Origin-Opener-Policy` or `Cross-Origin-Embedder-Policy` headers.
spec: https://wicg.github.io/document-isolation-policy/
group: security
