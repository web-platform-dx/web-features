draft_date: 2026-08-11
name: HTML processing instructions
description: Processing instructions such as `<?xml>` were originally only supported in XML documents, and treated as comments when present in HTML documents. Browsers have started supporting them in HTML documents for out-of-order streaming (using `<?start>`, `<?end>`, and `<?marker>`) and other use cases.
spec: https://html.spec.whatwg.org/multipage/syntax.html#processing-instructions
