name: wrap-inside
description: The `wrap-inside` CSS property set to `avoid` suppresses line breaks inside an inline box, unless there are no other places to break the line.
spec: https://drafts.csswg.org/css-text-4/#wrap-inside
group: text-wrap
compat_features:
  - css.properties.wrap-inside
  - css.properties.wrap-inside.auto
  - css.properties.wrap-inside.avoid
