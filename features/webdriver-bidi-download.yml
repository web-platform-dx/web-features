name: WebDriver BiDi download
description: The `downloadWillBegin` and `downloadEnd` events observe file downloads, and the `browser.setDownloadBehavior` command controls whether downloading files is allowed and sets the download folder location.
spec: https://w3c.github.io/webdriver-bidi/#command-browser-setDownloadBehavior
group: webdriver
compat_features:
  - webdriver.bidi.browser.setDownloadBehavior
  - webdriver.bidi.browser.setDownloadBehavior.downloadBehavior_parameter
  - webdriver.bidi.browser.setDownloadBehavior.userContexts_parameter
  - webdriver.bidi.browsingContext.downloadEnd_event
  - webdriver.bidi.browsingContext.downloadEnd_event.context_parameter
  - webdriver.bidi.browsingContext.downloadEnd_event.download_parameter
  - webdriver.bidi.browsingContext.downloadEnd_event.filepath_parameter
  - webdriver.bidi.browsingContext.downloadEnd_event.navigation_parameter
  - webdriver.bidi.browsingContext.downloadEnd_event.status_parameter
  - webdriver.bidi.browsingContext.downloadEnd_event.timestamp_parameter
  - webdriver.bidi.browsingContext.downloadEnd_event.url_parameter
  - webdriver.bidi.browsingContext.downloadEnd_event.userContext_parameter
  - webdriver.bidi.browsingContext.downloadWillBegin_event
  - webdriver.bidi.browsingContext.downloadWillBegin_event.context_parameter
  - webdriver.bidi.browsingContext.downloadWillBegin_event.download_parameter
  - webdriver.bidi.browsingContext.downloadWillBegin_event.navigation_parameter
  - webdriver.bidi.browsingContext.downloadWillBegin_event.suggestedFilename_parameter
  - webdriver.bidi.browsingContext.downloadWillBegin_event.timestamp_parameter
