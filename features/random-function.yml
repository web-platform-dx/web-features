name: random()
description: "The `random()` CSS function chooses a random numeric value within a specified range. This allows for dynamic, randomized styling using CSS."
spec: https://drafts.csswg.org/css-values-5/#random
group: css
compat_features:
  - css.types.random
  - css.types.random.auto
  - css.types.random.dashed-ident
  - css.types.random.element-scoped
  - css.types.random.fixed
  - css.types.random.property-index-scoped
  - css.types.random.property-scoped
