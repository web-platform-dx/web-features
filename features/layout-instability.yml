name: Layout instability
description: A `layout-shift` performance entry measures the layout stability of web pages based on movements of the elements on the page. They're used to calculate Cumulative Layout Shift (CLS), a common metric for perceived stability.
spec: https://wicg.github.io/layout-instability/
group: performance
compat_features:
  - api.LayoutShift
  - api.LayoutShift.hadRecentInput
  - api.LayoutShift.lastInputTime
  - api.LayoutShift.sources
  - api.LayoutShift.toJSON
  - api.LayoutShift.value
  - api.LayoutShiftAttribution
  - api.LayoutShiftAttribution.currentRect
  - api.LayoutShiftAttribution.node
  - api.LayoutShiftAttribution.previousRect
  - api.LayoutShiftAttribution.toJSON
