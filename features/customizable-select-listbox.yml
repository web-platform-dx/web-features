name: Customizable <select> listbox
description: The `<select>` element's appearance can be customized using CSS when displayed as a listbox (using the `multiple` or `size` attributes).
spec: https://html.spec.whatwg.org/multipage/rendering.html#the-select-element-2
group:
  - forms
  - html-elements
compat_features:
  - css.properties.appearance.base-select.list_box
