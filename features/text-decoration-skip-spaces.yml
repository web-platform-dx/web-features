name: text-decoration-skip-spaces
description: >
  The `text-decoration-skip-spaces` CSS property sets whether text decoration lines (such as underlines and overlines) skip over whitespace characters.
  You can use this to prevent decorations from being drawn under spaces, which is sometimes more visually appealing.
spec: https://drafts.csswg.org/css-text-decor-4/#text-decoration-skip-spaces-property
group: text
compat_features:
  - css.properties.text-decoration-skip-spaces
  - css.properties.text-decoration-skip-spaces.all
  - css.properties.text-decoration-skip-spaces.end
  - css.properties.text-decoration-skip-spaces.none
  - css.properties.text-decoration-skip-spaces.start
