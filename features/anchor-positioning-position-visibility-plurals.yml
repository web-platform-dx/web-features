name: anchors-valid and anchors-visible
description: >
  The `position-visibility: anchors-valid` and `position-visibility: anchors-visible` CSS declarations are aliases for `anchor-valid` and `anchor-visible`.
spec: https://drafts.csswg.org/css-anchor-position-1/#position-visibility
discouraged:
  reason: The `anchors-valid` and `anchors-visible` values were renamed to the singular `anchor-valid` and `anchor-visible` values, since they refer to one anchor at a time.
  according_to:
    - https://drafts.csswg.org/css-anchor-position-1/#position-visibility:~:text=User%20agents%20may%20recognize%20anchors%2Dvalid%20and%20anchors%2Dvisible
    - https://github.com/w3c/csswg-drafts/issues/10201#issuecomment-4390233490
  # No `alternatives` because it would be `alternatives: anchor-positioning`.
  # Revisit this once it's known what subset of `anchor-positioning` keys become
  # the first Baseline cohort, then consider minting `position-visibility`
  # feature(s) as needed.
compat_features:
  - css.properties.position-visibility.anchors-valid
  - css.properties.position-visibility.anchors-visible
