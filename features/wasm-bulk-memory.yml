name: Bulk memory operations (WebAssembly)
description: Bulk memory operations, such as `copy` and `init`, mirror the efficiency of native `memcpy` and `memmove` operations.
spec: https://webassembly.github.io/spec/core/bikeshed/
caniuse: wasm-bulk-memory
group: webassembly
compat_features:
  - webassembly.bulk-memory-operations
  - webassembly.definitions.data
  - webassembly.definitions.elem
  - webassembly.instructions.data_drop
  - webassembly.instructions.elem_drop
  - webassembly.instructions.memory_copy
  - webassembly.instructions.memory_fill
  - webassembly.instructions.memory_init
  - webassembly.instructions.table_copy
  - webassembly.instructions.table_init
