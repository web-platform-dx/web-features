name: "@mixin"
description: "The `@mixin` and `@apply` CSS at-rules define reusable style declaration fragments and apply them inside rules, optionally passing arguments."
spec: https://drafts.csswg.org/css-mixins-1/#mixin-rule
group: css
compat_features:
  - api.CSSMixinRule
  - api.CSSMixinRule.name
  - css.at-rules.apply
  - css.at-rules.contents
  - css.at-rules.mixin
  - css.at-rules.private
