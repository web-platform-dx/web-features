name: JavaScript promise integration (WebAssembly)
description: >
  The JavaScript promise integration (JSPI) suspends a WebAssembly module when it calls a JavaScript method that returns a promise.
  The module resumes when the promise is resolved. You can use this to call asynchronous web APIs from synchronous WebAssembly.
spec: https://webassembly.github.io/js-promise-integration/js-api/
group: webassembly
compat_features:
  - webassembly.api.promising_static
  - webassembly.api.SuspendError
  - webassembly.api.SuspendError.SuspendError
  - webassembly.api.Suspending
  - webassembly.api.Suspending.Suspending
  - webassembly.jspi
