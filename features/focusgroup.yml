name: focusgroup
description: >
  The `focusgroup` global HTML attribute combines descendant elements into a single tab stop, with arrow-key navigation between them, for toolbars, tabs, menus, radio groups, and other composite controls.
  It's an alternative to the sequential navigation of `tabindex`.
spec: https://github.com/whatwg/html/pull/11723
group:
  - html
  - reading-order
