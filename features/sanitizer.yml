name: Sanitizer API
description: The `Sanitizer` API customizes the sanitization of HTML parsed and inserted into the DOM in a way that can prevent cross-site scripting attacks. You can use it with DOM APIs that accept a sanitizer option, such as `parseHTML()` or `setHTML()`.
spec: https://html.spec.whatwg.org/multipage/dynamic-markup-insertion.html#html-sanitization
compat_features:
  # The main entry points.
  # There are additional entry points in `html-setters.yml`
  - api.Element.setHTML
  - api.ShadowRoot.setHTML
  - api.Document.parseHTML_static
  # The Sanitizer interface can optionally be used for custom HTML
  # sanitization.
  - api.Sanitizer
  - api.Sanitizer.Sanitizer
  - api.Sanitizer.allowAttribute
  - api.Sanitizer.allowElement
  - api.Sanitizer.get
  - api.Sanitizer.removeAttribute
  - api.Sanitizer.removeElement
  - api.Sanitizer.removeUnsafe
  - api.Sanitizer.replaceElementWithChildren
  - api.Sanitizer.setComments
  - api.Sanitizer.setDataAttributes
