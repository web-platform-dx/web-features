name: Sanitizer API
description: The `Sanitizer` API can customize the sanitization process used to parse and insert HTML into the DOM in a way that can prevent cross-site scripting attacks. `Document.parseHTML()` and other DOM methods like `setHTML()` can use the Sanitizer API on the provided HTML.
spec: https://html.spec.whatwg.org/multipage/dynamic-markup-insertion.html#html-sanitization
compat_features:
  - api.Document.parseHTML_static
  - api.Sanitizer
  - api.Sanitizer.Sanitizer
  - api.Sanitizer.allowAttribute
  - api.Sanitizer.allowElement
  - api.Sanitizer.get
  - api.Sanitizer.removeAttribute
  - api.Sanitizer.removeElement
  - api.Sanitizer.removeUnsafe
  - api.Sanitizer.replaceElementWithChildren
  - api.Sanitizer.setComments
  - api.Sanitizer.setDataAttributes
