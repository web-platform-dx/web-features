name: Shared worker extended lifetime
description: The `extendedLifetime` option of the `SharedWorker()` constructor gives shared workers extra time to perform operations after all pages using it have been navigated away from or closed.
spec: https://html.spec.whatwg.org/multipage/workers.html#dom-sharedworkeroptions-extendedlifetime
group: workers
compat_features:
