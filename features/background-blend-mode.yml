name: background-blend-mode
description: The `background-blend-mode` CSS property blends an element's background image and background color using blend modes like `multiply`, `difference`, or `color`.
spec: https://drafts.csswg.org/compositing-2/#background-blend-mode
caniuse: css-backgroundblendmode
group: blend-mode
compat_features:
  - css.properties.background-blend-mode
  - css.properties.background-blend-mode.color
  - css.properties.background-blend-mode.color-burn
  - css.properties.background-blend-mode.color-dodge
  - css.properties.background-blend-mode.darken
  - css.properties.background-blend-mode.difference
  - css.properties.background-blend-mode.exclusion
  - css.properties.background-blend-mode.hard-light
  - css.properties.background-blend-mode.hue
  - css.properties.background-blend-mode.lighten
  - css.properties.background-blend-mode.luminosity
  - css.properties.background-blend-mode.multiply
  - css.properties.background-blend-mode.normal
  - css.properties.background-blend-mode.overlay
  - css.properties.background-blend-mode.saturation
  - css.properties.background-blend-mode.screen
  - css.properties.background-blend-mode.soft-light
  - css.types.blend-mode
