name: Page setup
description: The `@page` CSS at-rule sets the page-specific dimensions and margins for content such as printed documents, ebooks, or slides.
spec: https://drafts.csswg.org/css-page-3/#at-page-rule
group:
  - layout
  - print
caniuse: css-paged-media
status:
  compute_from: css.at-rules.page.size
compat_features:
  - css.at-rules.page
  - css.at-rules.page.at_bottom-center
  - css.at-rules.page.at_bottom-left
  - css.at-rules.page.at_bottom-left-corner
  - css.at-rules.page.at_bottom-right
  - css.at-rules.page.at_bottom-right-corner
  - css.at-rules.page.at_left-bottom
  - css.at-rules.page.at_left-middle
  - css.at-rules.page.at_left-top
  - css.at-rules.page.at_right-bottom
  - css.at-rules.page.at_right-middle
  - css.at-rules.page.at_right-top
  - css.at-rules.page.size
  - css.at-rules.page.size.jis-b4
  - css.at-rules.page.size.jis-b5
  - css.at-rules.page.at_top-center
  - css.at-rules.page.at_top-left
  - css.at-rules.page.at_top-left-corner
  - css.at-rules.page.at_top-right
  - css.at-rules.page.at_top-right-corner
  - css.properties.page
