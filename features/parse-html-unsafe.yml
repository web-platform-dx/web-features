name: Unsanitized HTML parsing methods
description: The `Document.parseHTMLUnsafe()` static method parses HTML into a DOM tree, in a similar way that `setHTMLUnsafe` and similar DOM method inserts HTML into the DOM. No sanitization applies to these methods, so never call them with user-provided HTML strings.
spec: https://html.spec.whatwg.org/multipage/dynamic-markup-insertion.html#dom-parsing-and-serialization
compat_features:
  - api.Document.parseHTMLUnsafe_static
