name: text-decoration-inset
description: >
  The `text-decoration-inset` CSS property offsets the start and end point of a text decoration.
  You can use this to shorten, lengthen, or shift the position of an underline, overline, or line-through.
spec: https://drafts.csswg.org/css-text-decor-4/#text-decoration-inset-property
group: text
compat_features:
  - css.properties.text-decoration-inset
  - css.properties.text-decoration-inset.auto
