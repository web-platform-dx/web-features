name: Iterator join()
description: The `join()` method of an `Iterator` object returns a string concatenation of all the iterator's items, separated by commas or a given separator string. It's similar to the `join()` method of arrays.
spec: https://tc39.es/ecma262/multipage/control-abstraction-objects.html#sec-iterator.prototype.join
group: iterators
compat_features:
  - javascript.builtins.Iterator.join
