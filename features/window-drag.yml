name: window-drag
description: >
  The `window-drag: move` CSS declaration sets an element as a window drag handle, like a device's app title bars.
  You can use this to add click-and-drag areas to a progressive web app, often alongside window controls overlay.
spec: https://drafts.csswg.org/css-ui-4/#window-drag
group:
  - css
  - progressive-web-app
compat_features:
  - css.properties.window-drag
  - css.properties.window-drag.move
  - css.properties.window-drag.none
