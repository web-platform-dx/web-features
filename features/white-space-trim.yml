name: white-space-trim
description: The `white-space-trim` CSS property removes white space at the beginning or end of an element, or immediately before or after it.
spec: https://drafts.csswg.org/css-text-4/#white-space-trim
group: white-space
compat_features:
  - css.properties.white-space-trim
  - css.properties.white-space-trim.discard-after
  - css.properties.white-space-trim.discard-before
  - css.properties.white-space-trim.discard-inner
  - css.properties.white-space-trim.none
