name: HTML-in-canvas
description: A `<canvas>` HTML element with the `content="drawable"` attribute can draw descendant elements in its rendering context. You can use it to style and layout text in a canvas, expose canvas content to browser features (like accessibility, translate, or find-in-page), and apply 2D and 3D effects to HTML.
spec: https://github.com/WICG/html-in-canvas/blob/main/README.md
group:
  - html-elements
  - canvas
  - webgl
  - webgpu
