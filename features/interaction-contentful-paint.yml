name: Interaction contentful paint
description: The `interaction-contentful-paint` performance entry, which returns a `InteractionContentfulPaint` instance, is emitted by the browser when an interaction causes one or more contentful paints. It is useful to measure LCP for SPA-style soft navigations or for measuring contentful paints due to an interaction.
spec: https://wicg.github.io/soft-navigations/#sec-interaction-contentful-paint
group: performance
