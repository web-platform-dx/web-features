name: Container Timing performance entries
description: A `container` performance entry measures time to render child elements, for container elements that have the `containertiming` attribute.
spec: https://wicg.github.io/container-timing/
group: performance
compat_features:
  - api.HTMLElement.containerTiming
  - api.HTMLElement.containerTimingIgnore
  - api.PerformanceContainerTiming
  - api.PerformanceContainerTiming.firstRenderTime
  - api.PerformanceContainerTiming.identifier
  - api.PerformanceContainerTiming.intersectionRect
  - api.PerformanceContainerTiming.lastPaintedElement
  - api.PerformanceContainerTiming.rootElement
  - api.PerformanceContainerTiming.size
  - html.global_attributes.containertiming
  - html.global_attributes.containertimingignore
